on:
  push:
    branches: ['**']
  pull_request:
    branches: [develop, edge]
  workflow_dispatch:
#env:
#  group: brewblox
jobs:
  build:
    runs-on: Ubuntu-22.04
    permissions:
      packages: write
    steps:
    - uses: actions/checkout@v3
    - uses: docker/setup-qemu-action@v2
    - uses: docker/setup-buildx-action@v2

    - name: Get image metadata
      id: meta
      uses: docker/metadata-action@v4
      with:
        images: ghcr.io/mrstone14/brewblox-brewfather-service

    - name: ghcr.io login
      uses: docker/login-action@v2
      if: github.event_name != 'pull_request'
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    - name: Setup Python 3.7
      uses: actions/setup-python@v5
      with:
        python-version: 3.7

    - name: Export .env variables
      run: |
        set -o allexport; source .env; set +o allexport
        echo "##vso[task.setvariable variable=DOCKER_REPO]${{ env.DOCKER_REPO }}"
    - name: Export build variables
      run: |
        BRANCH=$(echo ${{ github.ref }} | grep -oP "^refs/heads/\K.*")
        echo "##vso[task.setvariable variable=BRANCH]$BRANCH"
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install poetry
        poetry install
    - name: Run Pytest
      run: poetry run pytest
    - name: Prepare buildx
      run: curl -fsSL https://raw.githubusercontent.com/BrewBlox/deployed-images/develop/prepare_buildx.sh | bash
    - name: Run before_build.sh script
      run: bash ./before_build.sh
    - name: Build Docker image
      run: docker buildx build --push --platform linux/amd64,linux/arm/v7,linux/arm64/v8 docker
